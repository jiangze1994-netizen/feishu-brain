<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>飞书知识大脑</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f6f7; --card:#fff; --line:#e8e8ea; --ink:#1a1a1a;
  --sub:#6b6b70; --dim:#9a9aa0; --accent:#185fa5; --accent-soft:#e6f1fb;
  --warn:#8a5a00; --warn-soft:#faeeda;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-font-smoothing:antialiased;
}
header{
  position:sticky; top:0; z-index:20; background:rgba(246,246,247,.92);
  backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--line);
  padding:18px 24px 14px;
}
.hd{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
.meta{font-size:12px;color:var(--sub)}
.meta b{color:var(--ink);font-weight:500}
#q{
  width:100%; margin-top:12px; padding:10px 14px; font-size:14px;
  border:1px solid var(--line); border-radius:10px; background:var(--card);
  outline:none; transition:border-color .15s;
}
#q:focus{border-color:var(--accent)}
main{display:flex;gap:0;align-items:flex-start;min-height:calc(100vh - 120px)}
aside{
  width:220px; flex:0 0 220px; padding:16px 12px 40px; position:sticky; top:104px;
  max-height:calc(100vh - 104px); overflow:auto;
}
.set{
  display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;
  cursor:pointer;font-size:13px;color:var(--sub);transition:background .12s;
}
.set:hover{background:#ececee}
.set.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.set span{color:var(--dim);font-variant-numeric:tabular-nums;font-size:12px}
.set.on span{color:var(--accent)}
#list{flex:1;min-width:0;padding:16px 24px 60px 8px}
.row{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .12s,transform .12s;
}
.row:hover{border-color:#d0d0d5;transform:translateY(-1px)}
.row h3{font-size:14px;font-weight:500;line-height:1.4;margin-bottom:5px}
.row .sn{font-size:12.5px;color:var(--sub);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .tags{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;background:#f0f0f2;color:var(--sub)}
.tag.set{background:var(--accent-soft);color:var(--accent)}
.tag.ev{background:#e1f5ee;color:#0f6e56}
.tag.inf{background:var(--warn-soft);color:var(--warn)}
.tag.num{font-variant-numeric:tabular-nums}
.empty{padding:60px 20px;text-align:center;color:var(--dim)}
#detail{
  position:fixed;inset:0;z-index:40;background:rgba(20,20,22,.28);
  display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;
}
#detail[hidden]{display:none}
.panel{
  background:var(--card);border-radius:16px;max-width:820px;width:100%;
  padding:26px 30px 34px;box-shadow:0 12px 40px rgba(0,0,0,.14);
}
.panel h2{font-size:17px;font-weight:600;line-height:1.45;margin-bottom:8px}
.panel .pm{font-size:12px;color:var(--dim);margin-bottom:18px}
.panel .pm a{color:var(--accent);text-decoration:none}
.sec{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.sec h4{font-size:12px;font-weight:500;color:var(--dim);letter-spacing:.04em;margin-bottom:9px}
.body{white-space:pre-wrap;font-size:13.5px;line-height:1.75;color:#333;
  max-height:340px;overflow:auto;background:#fafafa;border-radius:10px;padding:14px 16px}
.lk{font-size:13px;padding:5px 0;color:var(--sub);cursor:pointer}
.lk:hover{color:var(--accent)}
.lk i{font-style:normal;color:var(--dim);font-size:11.5px;margin-left:6px}
.close{float:right;cursor:pointer;color:var(--dim);font-size:20px;line-height:1;padding:0 4px}
.close:hover{color:var(--ink)}
mark{background:#fff3b0;color:inherit;border-radius:2px;padding:0 1px}
@media(max-width:720px){
  main{flex-direction:column}
  aside{width:100%;flex:none;position:static;max-height:none;display:flex;gap:6px;
    overflow-x:auto;padding:12px 16px 0}
  .set{white-space:nowrap;padding:6px 12px;border:1px solid var(--line);border-radius:20px}
  #list{padding:12px 16px 60px}
  .panel{padding:20px}
}
</style>
</head>
<body>

<header>
  <div class="hd">
    <h1 id="ttl">飞书知识大脑</h1>
    <div class="meta" id="meta"></div>
  </div>
  <input id="q" type="search" placeholder="搜标题、正文、结论…（输入两个字以上搜正文）" autocomplete="off">
</header>

<main>
  <aside id="sets"></aside>
  <section id="list"><div class="empty">载入中…</div></section>
</main>

<div id="detail" hidden></div>

<script>const DATA = /*__DATA__*/;</script>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const D = DATA;
  const bodies = D.bodies || {};
  const links = D.links || {};
  const state = {q:'', set:'', tab:'docs'};
  const docMap = {};
  (D.docs||[]).forEach(d => docMap[d.token] = d);

  function fmt(n){ return (n||0).toLocaleString('zh-CN'); }

  function init(){
    const m = D.meta || {};
    $('#ttl').textContent = (m.owner ? m.owner + '的' : '') + '飞书知识大脑';
    $('#meta').innerHTML = [
      '<b>'+fmt(m.doc_count)+'</b> 篇',
      '<b>'+(Math.round((m.char_count||0)/10000))+'</b> 万字',
      m.stages_done ? '阶段 <b>'+m.stages_done.join('/')+'</b>' : '',
      m.generated_at ? '生成于 '+m.generated_at.slice(0,16).replace('T',' ') : ''
    ].filter(Boolean).join(' · ');
    renderSets();
    renderList();
    $('#q').addEventListener('input', debounce(e => {
      state.q = e.target.value.trim();
      renderList();
    }, 220));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeDetail();
      if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
    });
  }

  function debounce(fn, ms){
    let t; return function(){ const a = arguments, c = this; clearTimeout(t); t = setTimeout(()=>fn.apply(c,a), ms); };
  }

  function renderSets(){
    const sets = D.sets || [];
    const total = (D.docs||[]).length;
    let html = '<div class="set'+(state.set===''?' on':'')+'" data-set="">全部 <span>'+fmt(total)+'</span></div>';
    sets.forEach(s => {
      html += '<div class="set'+(state.set===s.id?' on':'')+'" data-set="'+s.id+'">'
            + esc(s.name)+' <span>'+fmt(s.doc_count)+'</span></div>';
    });
    $('#sets').innerHTML = html;
    $('#sets').querySelectorAll('.set').forEach(el => {
      el.onclick = () => { state.set = el.dataset.set; renderSets(); renderList(); };
    });
  }

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function searchBlob(d){
    // 只索引标题 + 正文前 800 字，控住搜索成本
    if (d._blob == null) d._blob = ((d.title||'') + ' ' + (bodies[d.token]||'').slice(0,800)).toLowerCase();
    return d._blob;
  }

  function renderList(){
    const q = state.q.toLowerCase();
    let list = (D.docs||[]).filter(d => {
      if (state.set && d.set !== state.set) return false;
      if (!q) return true;
      if (searchBlob(d).indexOf(q) >= 0) return true;
      if (q.length >= 2 && d._full == null) {
        d._full = (bodies[d.token]||'').toLowerCase();
      }
      return q.length >= 2 && d._full && d._full.indexOf(q) >= 0;
    });

    if (!q && !state.set) {
      list = list.slice().sort((a,b) => (b.chars||0) - (a.chars||0));
    } else if (q) {
      list = list.slice().sort((a,b) => {
        const ta = (a.title||'').toLowerCase().indexOf(q) >= 0 ? 1 : 0;
        const tb = (b.title||'').toLowerCase().indexOf(q) >= 0 ? 1 : 0;
        return tb - ta || (b.chars||0) - (a.chars||0);
      });
    }

    if (!list.length){
      $('#list').innerHTML = '<div class="empty">没有匹配的文档<br><span style="font-size:12px">试试更短的关键词，或换一个集</span></div>';
      return;
    }

    const cap = 300;
    let html = '';
    list.slice(0, cap).forEach(d => { html += card(d, q); });
    if (list.length > cap) html += '<div class="empty">还有 '+(list.length-cap)+' 篇，请缩小关键词</div>';
    $('#list').innerHTML = html;
    $('#list').querySelectorAll('.row').forEach(el => {
      el.onclick = () => openDetail(el.dataset.t);
    });
  }

  function card(d, q){
    const snip = highlight(snippet(bodies[d.token]||'', q), q);
    const tags = [];
    if (d.set_name) tags.push('<span class="tag set">'+esc(d.set_name)+'</span>');
    if (d.year) tags.push('<span class="tag num">'+esc(d.year)+'</span>');
    if (d.space && d.space !== '云空间') tags.push('<span class="tag">'+esc(d.space)+'</span>');
    tags.push('<span class="tag num">'+fmt(d.chars)+' 字</span>');
    if (d.evident) tags.push('<span class="tag ev">证据可用</span>');
    return '<article class="row" data-t="'+d.token+'">'
         + '<h3>'+highlight(esc(d.title||'（无标题）'), q)+'</h3>'
         + (snip ? '<div class="sn">'+snip+'</div>' : '')
         + '<div class="tags">'+tags.join('')+'</div>'
         + '</article>';
  }

  function snippet(text, q){
    if (!text) return '';
    if (!q) return esc(text.replace(/\s+/g,' ').slice(0,110));
    const low = text.toLowerCase(), i = low.indexOf(q);
    if (i < 0) return esc(text.replace(/\s+/g,' ').slice(0,110));
    const s = Math.max(0, i-45), e = Math.min(text.length, i+q.length+75);
    return (s>0?'…':'') + esc(text.slice(s,e).replace(/\s+/g,' ')) + (e<text.length?'…':'');
  }

  function highlight(html, q){
    if (!q) return html;
    try {
      const safe = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return html.replace(new RegExp(safe, 'gi'), m => '<mark>'+m+'</mark>');
    } catch(e){ return html; }
  }

  function openDetail(tok){
    const d = docMap[tok];
    if (!d) return;
    const out = (links.outlinks||{})[tok] || [];
    const back = (links.backlinks||{})[tok] || [];
    const sim = (links.similar||{})[tok] || [];
    const kn = (D.knowledge||[]).filter(k => (k.sources||[]).indexOf(tok) >= 0);

    let h = '<div class="panel"><span class="close" id="x">×</span>';
    h += '<h2>'+esc(d.title||'（无标题）')+'</h2>';
    h += '<div class="pm">'
       + [d.set_name, d.year, d.space, fmt(d.chars)+' 字', d.date]
           .filter(Boolean).map(esc).join(' · ')
       + ' · <a href="'+esc(d.url)+'" target="_blank" rel="noopener">在飞书中打开 ↗</a></div>';

    if (bodies[tok]) h += '<div class="body">'+esc(bodies[tok])+'</div>';

    if (kn.length){
      h += '<div class="sec"><h4>这篇贡献了 '+kn.length+' 条知识</h4>';
      kn.forEach(k => {
        h += '<div class="lk" style="cursor:default">'+esc(k.title||'')
           + ' <i>'+esc(k.conclusion||'')+'</i></div>';
      });
      h += '</div>';
    }

    if (out.length){
      h += '<div class="sec"><h4>本文引用了 '+out.length+' 篇 <span class="tag">实测</span></h4>';
      out.forEach(t => { h += linkLine(t, ''); });
      h += '</div>';
    }
    if (back.length){
      h += '<div class="sec"><h4>被 '+back.length+' 篇引用 <span class="tag">实测</span></h4>';
      back.forEach(t => { h += linkLine(t, ''); });
      h += '</div>';
    }
    if (sim.length){
      h += '<div class="sec"><h4>内容相近 '+sim.length+' 篇 <span class="tag inf">推断</span></h4>';
      sim.forEach(([t, s]) => { h += linkLine(t, '相似度 '+s); });
      h += '</div>';
    }
    h += '</div>';

    const box = $('#detail');
    box.innerHTML = h;
    box.hidden = false;
    box.querySelector('#x').onclick = closeDetail;
    box.onclick = e => { if (e.target === box) closeDetail(); };
    box.querySelectorAll('.lk[data-t]').forEach(el => {
      el.onclick = () => openDetail(el.dataset.t);
    });
  }

  function linkLine(tok, note){
    const d = docMap[tok];
    const t = d ? (d.title||'（无标题）') : tok;
    return '<div class="lk" data-t="'+tok+'">'+esc(t)
         + (note ? '<i>'+esc(note)+'</i>' : '')
         + (d && d.year ? '<i>'+esc(d.year)+'</i>' : '') + '</div>';
  }

  function closeDetail(){
    const box = $('#detail');
    box.hidden = true;
    box.innerHTML = '';
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
